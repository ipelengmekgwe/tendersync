name: Docker images

# Builds the four images (PLAN.md §15) and, on main, publishes them to GitHub Container Registry:
#   ghcr.io/<owner>/tendersync-api | -worker | -migrate | -web
# tagged with the full commit SHA, sha-<short> and latest. Pull requests that touch image inputs build without
# pushing, so a broken Dockerfile shows up as a failed check before merge. The Compose stack runs the published images
# with TENDERSYNC_REGISTRY=ghcr.io/<owner>/ and TENDERSYNC_TAG=<sha or latest> (docs/runbooks/local.md).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - src/**
      - web/**
      - deploy/docker/**
      - Directory.*
      - .dockerignore
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: .
            file: deploy/docker/dotnet.Dockerfile
            target: api
          - image: worker
            context: .
            file: deploy/docker/dotnet.Dockerfile
            target: worker
          - image: migrate
            context: .
            file: deploy/docker/dotnet.Dockerfile
            target: migrate
          - image: web
            context: web
            file: web/Dockerfile
            target: ""
    env:
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/tendersync-${{ matrix.image }}
          tags: |
            type=sha,format=long,prefix=
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=tendersync-${{ matrix.image }}
            org.opencontainers.image.description=TenderSync ${{ matrix.image }} (PLAN.md §15)

      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: false

      - name: Summary
        if: env.PUSH == 'true'
        run: |
          {
            echo "### tendersync-${{ matrix.image }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
