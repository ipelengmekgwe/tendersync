# Development settings for the full stack. Docker Compose loads this file automatically when run from deploy/docker
# without -f (the helper scripts do that unless -Prod / --prod is given).
#
# - ASPNETCORE_ENVIRONMENT=Development: the API signs anyone in as Admin (DevAuth:AllowAnyCredentials, as with
#   `dotnet run`), applies migrations on start, and the Worker accepts --seed-demo.
# - Placeholder secrets so `docker compose up` works from a clean clone. They are public and INSECURE: values in
#   deploy/docker/.env win over them (tendersync.ps1 init generates random ones). Never use this file on a server.

x-dev-environment: &dev-environment
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
  Jwt__SigningKey: ${Jwt__SigningKey:-insecure-dev-only-signing-key-do-not-use-anywhere-else-0123456789}
  Seed__AdminEmail: ${Seed__AdminEmail:-admin@tendersync.local}
  Seed__AdminPassword: ${Seed__AdminPassword:-TenderSync-dev-only-1}
  # base64 of "insecure-dev-only-key-0123456789" (32 bytes): documents encrypted with it are readable by anyone.
  TENDERSYNC_MASTER_KEY: ${TENDERSYNC_MASTER_KEY:-aW5zZWN1cmUtZGV2LW9ubHkta2V5LTAxMjM0NTY3ODk=}

services:
  migrate:
    environment: *dev-environment
  api:
    environment: *dev-environment
  worker:
    environment: *dev-environment
